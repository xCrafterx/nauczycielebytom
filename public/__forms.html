<!doctype html>
<html lang="pl">
  <head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Formularz kontaktowy</title></head>
  <body>
    <form name="kontakt" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="kontakt">
      <input name="bot-field">
      <input name="name">
      <select name="class"><option>Inna</option></select>
      <input name="email" type="email">
      <input name="subject">
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
